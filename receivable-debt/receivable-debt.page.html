<ion-header [translucent]="true">
	<app-toolbar [page]="this" [pageTitle]="'Debts to be collected' | translate"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="left scrollx" [ngClass]="{withFeature: pageConfig.isShowFeature}" forceOverscroll="false">
	<app-page-title class="ion-padding safe-max-width" [pageConfig]="pageConfig"></app-page-title>

	<ion-fab *ngIf="pageConfig.isShowFeature" [ngClass]="{withSearch: pageConfig.isShowSearch}" class="feature" vertical="top" horizontal="end" slot="fixed">
		<div class="ion-padding ion-margin"></div>
	</ion-fab>

	<div class="safe-max-width">
		<app-data-table
			class="box-shadow responsive"
			[rows]="items"
			[trackBy]="'Id'"
			[(selectedRows)]="selectedItems"
			[showSpinner]="pageConfig.showSpinner"
			[showFilter]="pageConfig.isShowSearch"
			[(query)]="query"
			(dataInfinite)="loadData($event)"
			(filter)="onDatatableFilter($event)"
			(sort)="onSort($event)"
			(selectedRowsChange)="showCommandBySelectedRows($event)"
		>
			<datatable-column [checkbox]="true" name=""></datatable-column>
			<datatable-column class="col-id" name="#Order" property="Id">
				<ng-template let-i="row" datatable-cell-template>
					<a [href]="'#/'+'sale-order/'+i.Id" (click)="nav('sale-order/'+i.Id,'forward')" class="col-id cell"> {{i.Id}} </a>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-code" name="Order created date" property="OrderDate" filterControlType="date">
				<ng-template let-i="row" datatable-cell-template>
					<div class="col-code cell" (click)="query.OrderDate=i.Query; pageConfig.isShowSearch=true; refresh()">{{i.OrderDateText}}</div>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-name" name="Customer" property="CustomerName">
				<ng-template let-i="row" datatable-cell-template>
					<span title="{{'View order details' | translate}}" (click)="nav('sale-order/'+i.Id,'forward')">{{i.CustomerName}}</span>
					<small title="{{'Search for this customer' | translate}}" (click)="query.CustomerName='C:'+i.IDContact; pageConfig.isShowSearch=true; refresh()">
						{{i.IDContact}}
					</small>
					<a [href]="'#/'+'business-partner/'+i.IDContact" (click)="nav('business-partner/'+i.IDContact,'forward')" title="{{'View customers information' | translate}}">
						<ion-icon name="open-outline"></ion-icon>
					</a>
				</ng-template>
			</datatable-column>
			<datatable-column class="col-code money" name="Total" property="TotalAfterTax">
				<ng-template let-i="row" datatable-cell-template> {{i.TotalAfterTaxText}} </ng-template>
			</datatable-column>
			<datatable-column class="col-code money" name="Remaining debt" property="Debt" [canFilter]="false">
				<ng-template let-i="row" datatable-cell-template> {{i.DebtText}} </ng-template>
			</datatable-column>
			<datatable-column class="col-code" name="Vendor code" property="Code"></datatable-column>
		</app-data-table>
	</div>

	<div class="ion-padding"></div>
</ion-content>
