<ion-header [translucent]="true">
	<app-toolbar [page]="this"></app-toolbar>
</ion-header>

<ion-content [fullscreen]="true" appScrollbarTheme class="header-table">
	<app-data-table
		class="box-shadow responsive"
		*ngIf="items"
		[rows]="items"
		[(selectedRows)]="selectedItems"
		(dataInfinite)="loadData($event)"
		[(query)]="query"
		(filter)="onDatatableFilter($event)"
		(sort)="onSort($event)"
		[showFilter]="pageConfig.isShowSearch"
		[showSpinner]="pageConfig.showSpinner"
	>
		<datatable-column class="col-id" name="ID item" property="ItemId">
			<ng-template let-i="row" datatable-cell-template>
				<a class="clickable" [routerLink]="['/item/' + i?.ItemId]"><span class="hide-small">#</span>{{ i?.ItemId }}</a>
				<small label class="hide-desktop">{{ i?.ItemCode }}</small>
			</ng-template>
		</datatable-column>

		<datatable-column class="col-name" name="Item name" property="ItemName">
			<ng-template let-i="row" datatable-cell-template>
				<span [title]="i.ItemName">
					<b class="hide-small">{{ i.ItemCode }}&nbsp;</b>{{ i.ItemName }}
				</span>
			</ng-template>
		</datatable-column>

		<datatable-column class="col-stock" name="Quantity" property="inStockOnly" [canSort]="false">
			<ng-template datatable-filter-template>
				<button type="button" class="stock-filter" [class.is-on]="query.inStockOnly" (click)="toggleInStock()">
					<ion-icon [name]="query.inStockOnly ? 'cube' : 'cube-outline'"></ion-icon>
					<span>{{ 'In stock only' | translate }}</span>
				</button>
			</ng-template>
			<ng-template let-i="row" datatable-cell-template>
				<div class="stock-list">
					<div class="stock-line" *ngFor="let w of i.Warehouses">
						<span class="stock-wh">{{ w.BranchName }}</span>
						<span class="stock-sep">&nbsp;</span>
						<span class="stock-qty">
							<app-format-quantity *ngIf="!isOutOfStock(w.CloseQuantity) && w.UoMs?.length" [quantity]="w.CloseQuantity" [splitQuantityList]="w.UoMs"></app-format-quantity>
							<span class="danger" *ngIf="isOutOfStock(w.CloseQuantity) || !w.UoMs?.length">{{ 'Out of stocks' | translate }}</span>
						</span>
					</div>
				</div>
			</ng-template>
		</datatable-column>

		<datatable-column class="col-price" name="Price" property="ItemId" [canFilter]="false" [canSort]="false">
			<ng-template let-i="row" datatable-cell-template>
				<div class="price-list" *ngIf="i.Prices?.length">
					<div *ngFor="let uom of i.Prices"><strong>{{ uom.Price | number }}</strong><small *ngIf="uom.UoMName">&nbsp;/{{ uom.UoMName }}</small></div>
				</div>
			</ng-template>
		</datatable-column>
	</app-data-table>
</ion-content>
